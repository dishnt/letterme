<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOULPOST - Send Physical Letters Online</title>
  
  <!-- CSS Stylesheet -->
  <link rel="stylesheet" href="style.css" />
  
 <!-- Enhanced Google Fonts Library -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Caveat:wght@500&family=Cinzel:wght@500;700&family=Courier+Prime&family=Great+Vibes&family=Homemade+Apple&family=Marck+Script&family=Playfair+Display:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="logo">✉️ <span>SOULPOST</span></div>
    <div class="tagline">Type virtually. Delivered physically.</div>
  </header>

  <!-- Main Container: Dual Panel -->
  <main class="app-container">
    
    <!-- LEFT PANEL: User Controls & Inputs -->
    <section class="control-panel">
      <h2>Craft Your Letter</h2>
      
      <form id="letterForm">
        <!-- Sender & Recipient Address Details -->
        <div class="form-group">
          <label for="senderName">Your Name (Sender)</label>
          <input type="text" id="senderName" placeholder="e.g. Rahul Sharma" required />
        </div>

        <div class="form-group">
          <label for="recipientDetails">Recipient Address & PIN Code</label>
          <textarea id="recipientDetails" rows="3" placeholder="Full Name&#10;House No., Street Area&#10;City, State - PIN Code" required></textarea>
        </div>

        <!-- Customization Options -->
        <div class="form-row">
  <div class="form-group">
    <label for="fontSelect">Choose Font Style</label>
    <select id="fontSelect">
      <!-- Vintage & Typewriter -->
      <option value="'Special Elite', monospace">Vintage Typewriter</option>
      <option value="'Courier Prime', monospace">Classic Courier</option>
      
      <!-- Handwriting & Personal -->
      <option value="'Homemade Apple', cursive">Raw Ink Handwriting</option>
      <option value="'Caveat', cursive">Casual Note</option>
      
      <!-- Elegant Cursive & Calligraphy -->
      <option value="'Marck Script', cursive">Romantic Cursive</option>
      <option value="'Great Vibes', cursive">Classic Calligraphy</option>
      <option value="'Alex Brush', cursive">Graceful Script</option>

      <!-- Luxury & Editorial -->
      <option value="'Cinzel', serif">Royal Empire (Serif)</option>
      <option value="'Playfair Display', serif">Editorial Luxury</option>
    </select>
  </div>

  <div class="form-group">
    <label for="paperSelect">Paper Template</label>
    <select id="paperSelect">
     <option value="official-a4">Official Business (Clean White)</option>
<option value="executive-cream">Executive Cream (Formal)</option>
<option value="parchment">Antique Parchment</option>
<option value="kraft">Recycled Kraft Paper</option>
<option value="rose">Rose Romance</option>
<option value="midnight">Midnight Gold (Dark Mode)</option>
    </select>
  </div>
</div> Area -->
        <div class="form-group">
          <label for="letterText">Your Letter Message</label>
          <textarea id="letterText" rows="7" placeholder="Start typing your letter here... watch it render live on the right!" required></textarea>
        </div><!-- Text Layout & Page Spacing Controls -->
<div class="form-row">
  <div class="form-group">
    <label for="fontSizeSelect">Text Size</label>
    <select id="fontSizeSelect">
      <option value="0.95rem">Compact (Squeeze more text)</option>
      <option value="1.1rem" selected>Standard (Default)</option>
      <option value="1.25rem">Large (Shorter notes)</option>
    </select>
  </div>

  <div class="form-group">
    <label for="lineHeightSelect">Line Spacing</label>
    <select id="lineHeightSelect">
      <option value="1.3">Tight (1.3)</option>
      <option value="1.6" selected>Normal (1.6)</option>
      <option value="1.9">Relaxed (1.9)</option>
    </select>
  </div>
</div>
<!-- Choice Switcher: Type or Upload -->
<div class="form-group">
  <label>How would you like to send your document?</label>
  <div class="radio-group">
    <label><input type="radio" name="docType" value="type" checked> Type Online</label>
    <label><input type="radio" name="docType" value="upload"> Upload PDF/Image</label>
  </div>
</div>

<!-- File Upload Input (Hidden by default) -->
<div class="form-group hidden" id="uploadGroup">
  <label for="documentFile">Upload PDF or Document (Max 10MB)</label>
  <input type="file" id="documentFile" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg" />
  <small style="color: #666; font-size: 0.8rem;">Supported formats: PDF, DOCX, PNG, JPG</small>
</div>
        <!-- Add-ons Selection -->
        <div class="addons-section">
          <h3>Add-ons</h3>
          <label class="checkbox-container">
            <input type="checkbox" id="waxSeal" />
            <span>Add Wax Seal (+₹29)</span>
          </label>
          <label class="checkbox-container">
            <input type="checkbox" id="scented" />
            <span>Fragrance Spray (+₹19)</span>
          </label>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="checkoutBtn" class="btn-primary">
          Send Letter (₹<span id="totalPrice">49</span>)
        </button>
      </form>
    </section>

    <!-- RIGHT PANEL: Live Paper & Envelope Preview -->
    <section class="preview-panel">
      <h2>Live Letter Preview</h2>
      
      <div class="paper-container parchment" id="paperPreview">
        <div class="letter-header">
          <div class="date" id="previewDate">Date: </div>
        </div>
        
        <div class="letter-body" id="previewBody">
          Start typing on the left to see your letter come to life...
        </div>
        
        <div class="letter-footer">
          <div class="signature" id="previewSignature"></div>
          <div id="previewWaxSeal" class="wax-seal-graphic hidden">Stamped</div>
        </div>
      </div>
    </section>

  </main>

  <!-- JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
