<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | SOULPOST</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="login-page-body">
  <header class="login-header">
    <nav class="login-topbar">
      <div class="login-brand">
        <span class="brand-mark">✉️</span>
        <span>SOULPOST</span>
      </div>
      <a href="index.html" class="login-back-link">Back to home</a>
    </nav>
  </header>

  <main class="login-shell">
    <div class="login-card">
      <div class="login-visual">
        <div class="login-note">
          <h2>Welcome back.</h2>
          <p>Sign in to manage your letters, revisit saved drafts, and send thoughtful messages that arrive beautifully.</p>
        </div>
      </div>

      <div class="login-form-wrap">
        <h1>Log in</h1>
        <div class="login-subtitle">Access your SOULPOST account</div>

        <form>
          <div class="form-field">
            <label for="email">Email</label>
            <input id="email" type="email" placeholder="you@example.com" />
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <input id="password" type="password" placeholder="Enter your password" />
          </div>

          <div class="form-row-inline">
            <label class="checkbox-label"><input type="checkbox" /> Remember me</label>
            <a href="#">Forgot password?</a>
          </div>

          <button type="submit" class="login-btn">Log in</button>
        </form>

        <p class="alt-login">No account yet? <a href="#">Create one</a></p>
      </div>
    </div>
  </main>
</body>
</html>
